name: JustRunMy

on:
  workflow_dispatch:
  schedule:
    - cron: '5 3 * * *'

permissions:
  contents: write
  actions: write

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JUSTRUNMY_COOKIE: ${{ secrets.JUSTRUNMY_COOKIE }}
      JUSTRUNMY_PROXY: ${{ secrets.JUSTRUNMY_PROXY }}
      JUSTRUNMY_APP_URL: ${{ secrets.JUSTRUNMY_APP_URL }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PASS: ${{ secrets.SSH_PASS }}
      SOCKS_PORT: ${{ secrets.SOCKS_PORT || '51080' }}
      SCREENSHOT_DIR: screenshots
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool scrot fonts-noto-cjk sshpass openssh-client

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install seleniumbase requests

      - name: 生成 sing-box 配置并启动本地代理
        if: env.JUSTRUNMY_PROXY != ''
        run: |
          set -euo pipefail

          SINGBOX_VERSION="v1.14.1"
          SINGBOX_NAME="sing-box-${SINGBOX_VERSION#v}-linux-amd64"

          echo "⬇️ 下载 sing-box ${SINGBOX_VERSION} ..."
          curl -fsSL -o /tmp/sing-box.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/${SINGBOX_VERSION}/${SINGBOX_NAME}.tar.gz"
          tar -xzf /tmp/sing-box.tar.gz -C /tmp
          sudo install -m 755 "/tmp/${SINGBOX_NAME}/sing-box" /usr/local/bin/sing-box
          sing-box version

          echo "🧩 解析节点链接并生成 sing-box 配置 ..."
          python build_singbox_config.py

          echo "🔍 校验 sing-box 配置 ..."
          sing-box check -c singbox/config.json

          echo "🚀 启动 sing-box ..."
          nohup sing-box run -c singbox/config.json > singbox.log 2>&1 &
          echo $! > singbox.pid

          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/"${SOCKS_PORT}") 2>/dev/null; then
              echo "✅ sing-box 已就绪: socks5://127.0.0.1:${SOCKS_PORT}"
              echo "JUSTRUNMY_PROXY=socks5://127.0.0.1:${SOCKS_PORT}" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done

          echo "❌ sing-box 启动失败，日志如下："
          cat singbox.log || true
          exit 1

      - name: 运行续期脚本
        run: |
          mkdir -p screenshots
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            python justrunmy_renew.py

      - name: 上传截图和页面诊断
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_id }}
          path: |
            screenshots/
            *.png
            *.jpg
          if-no-files-found: warn
          retention-days: 7

      - name: 提交执行时间
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p justrunmy
          date -u +'%Y-%m-%d %H:%M:%S UTC' > justrunmy/time.txt
          git add justrunmy/time.txt
          if ! git diff --cached --quiet; then
            git commit -m "更新 JustRunMy 执行时间"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: 自动清理历史工作流记录（只保留当前运行）
        if: always()
        run: |
          echo "开始清理历史工作流记录..."
          runs=$(gh run list --workflow="${{ github.workflow }}" --json databaseId --jq ".[] | select(.databaseId != ${{ github.run_id }}) | .databaseId")
          for run_id in $runs; do
            echo "正在删除运行记录: $run_id"
            gh run delete "$run_id" || true
          done
